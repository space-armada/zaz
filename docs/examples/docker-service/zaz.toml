# Docker-driven API: rebuild the image, run the container.
#
# `docker run` is a client. The container it starts belongs to the Docker
# daemon, not to the process group zaz tracks, so a signal to that group
# reaches the client and leaves the container running. The lifecycle hooks
# below drive the container by name instead.

[variables]
image = "myapp/api:dev"
container = "myapp-api"

[[group]]
name = "api"
patterns = ["src/**/*.go", "go.mod", "go.sum", "Dockerfile"]
ignore = ["**/*_test.go"]

  [[group.task]]
  name = "image"
  command = "docker build -t ${image} ."

  [[group.service]]
  name = "api"
  command = "docker run --rm --name ${container} -p 8080:8080 ${image}"
  cleanup_command = "docker rm --force ${container} 2>/dev/null || true"
  stop_command = "docker stop ${container}"
  kill_command = "docker kill ${container}"
  stop_timeout = "45s"
  no_pty = true
